# gitleaks config – default rules plus project allowlist
[extend]
useDefault = true

[allowlist]
description = "Placeholders and generated files"
paths = [
  '''\.env\.example$''',
  '''package-lock\.json$''',
  '''src/Opten\.Web/SeedData/''',
]
regexes = [
  '''ChangeMe![A-Za-z0-9]+''',
  '''local-dev-mcp-secret-[a-f0-9]+''',
]
