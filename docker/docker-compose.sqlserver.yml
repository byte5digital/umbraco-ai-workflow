# Optional override: SQL Server 2022 instead of SQLite (production-like).
#   docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.sqlserver.yml up --build
# Note: SQL Server has no native arm64 image – Docker Desktop emulates it on Apple Silicon (slower start).
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?DB_SA_PASSWORD missing - see .env.example}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - opten-db:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # One-shot job: creates the Umbraco database if it does not exist yet
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${DB_SA_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P "$$SA_PASSWORD" -b -Q "IF DB_ID('OptenUmbraco') IS NULL CREATE DATABASE [OptenUmbraco];"
    restart: "no"

  web:
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__umbracoDbDSN: "Server=db,1433;Database=OptenUmbraco;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__umbracoDbDSN_ProviderName: Microsoft.Data.SqlClient

volumes:
  opten-db:
