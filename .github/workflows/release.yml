name: Release

# Builds a deployable package for a version tag (v1.2.3). Hosting-agnostic: add the deploy step per project
# (IIS/Web Deploy, Linux + systemd, container registry …) and document it in an ADR.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: npm ci --ignore-scripts && npm run build:css
      - run: dotnet test Opten.Umbraco.slnx -c Release -p:SkipTailwind=true
      - run: dotnet publish src/Opten.Web/Opten.Web.csproj -c Release -p:SkipTailwind=true -o publish
      - name: Package
        run: cd publish && zip -qr "../opten-web-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v3
        with:
          files: opten-web-${{ github.ref_name }}.zip
          generate_release_notes: true

      # --- Deploy (project-specific) -----------------------------------------------------------
