name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test & package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install npm packages
        run: npm ci --ignore-scripts

      - name: Test CI scripts
        run: node --test ".github/scripts/*.test.mjs"

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Restore
        run: dotnet restore Opten.Umbraco.slnx

      - name: Check formatting
        run: dotnet format Opten.Umbraco.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build (warnings as errors)
        run: dotnet build Opten.Umbraco.slnx -c Release --no-restore -p:SkipTailwind=true -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test Opten.Umbraco.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Vulnerable NuGet packages
        run: |
          dotnet list Opten.Umbraco.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qE "^\s+>\s.*(High|Critical)" vulnerable.txt; then
            echo "::error::High/critical vulnerable NuGet packages found"; exit 1
          fi

      - name: Vulnerable npm packages
        run: npm audit --audit-level=high

      - name: Publish
        run: dotnet publish src/Opten.Web/Opten.Web.csproj -c Release --no-build -p:SkipTailwind=true -o publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: opten-web-${{ github.sha }}
          path: publish
          retention-days: 14

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image (no push)
        run: docker build -f docker/Dockerfile -t opten-umbraco-web:ci .
